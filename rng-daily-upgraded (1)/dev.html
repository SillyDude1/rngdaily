<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RNG//KERNEL — Console</title><link rel="stylesheet" href="styles.css"></head><body><main class="page"><div class="terminal"><div class="termhead"><span>RNG//KERNEL CONSOLE · PRIVATE ROUTE</span><a class="subnav" href="index.html">EXIT</a></div><div class="termout" id="termout"><p>&gt; secure console initialized</p><p>&gt; public interface: bypassed</p><p>&gt; type <b>help</b> to list commands</p></div><form id="termform"><span>&gt;</span><input id="termcmd" autocomplete="off" spellcheck="false" autofocus placeholder="enter command"><button>RUN</button></form></div></main><script src="app.js"></script><script>const out=document.querySelector("#termout"),cmd=document.querySelector("#termcmd");document.querySelector("#termform").onsubmit=e=>{e.preventDefault();let c=cmd.value.trim(),p=document.createElement("p");p.textContent="> "+c;out.append(p);let r="unknown command — type help",x=c.toLowerCase();if(x==="help")r="commands: help · scan <number> · roll · stats · clear · exit";if(x.startsWith("scan ")){let a=analyze(Number(x.slice(5)));r=a.s+" → "+a.score.toLocaleString()+" pts · "+a.details.map(d=>d[0]).join(", ")}if(x==="roll")r="roll queued";if(x==="stats")r=(state.totalRolls||0)+" total rolls · "+(state.coins||0)+" coins · best "+(state.best||0);if(x==="clear")r="destructive actions are disabled in console";if(x==="exit"){location.href="index.html";return}let q=document.createElement("p");q.className="ok";q.textContent=r;out.append(q);cmd.value="";out.scrollTop=out.scrollHeight}</script></body></html>
